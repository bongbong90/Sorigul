name: QA59 Windows capability probe (one authorized run)
on:
  push:
    branches: [qa/59-windows-runner-probe]
    paths: [.github/workflows/qa59-windows-capability.yml]
permissions:
  contents: read
concurrency:
  group: qa59-windows-capability
  cancel-in-progress: false
jobs:
  capability:
    if: github.repository == 'bongbong90/Sorigul' && github.event_name == 'push' && github.event.created == true && github.event.forced == false && github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Read reviewed QA harness only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: tools/qa59
      - name: One synthetic capability probe
        shell: powershell
        run: ./tools/qa59/Invoke-Probe.ps1
